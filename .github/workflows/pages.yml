name: Publish Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'reports/**'
      - 'robot/**'
      - 'docs/images/**'
      - 'config/hardware.json'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Standard library only. Copies the committed reports, viewer model and
      # pictures into site/. The printable STLs are never part of the site.
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
